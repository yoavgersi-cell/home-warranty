name: IndexNow ping

# Notifies IndexNow (Bing, Yandex, Seznam, Naver and the AI search engines
# that use their indexes) about every URL in the live sitemap, right after
# Vercel finishes a production deployment. Vercel reports deployments to
# GitHub as "Production", which is what triggers this. It can also be run
# by hand from the Actions tab.

on:
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HOST: www.thetophomewarranty.com
      # Public by design: IndexNow verifies it against the key file at the
      # site root (public/<key>.txt).
      INDEXNOW_KEY: 3a8a985c207070853c6284b33d48b12b41b28579510725fadb384d3ceab7f41b
    steps:
      - name: Wait for the live sitemap
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS "https://$HOST/sitemap.xml" -o sitemap.xml; then exit 0; fi
            sleep 10
          done
          echo "Sitemap not reachable" >&2
          exit 1

      - name: Verify the key file is live
        run: curl -fsS "https://$HOST/$INDEXNOW_KEY.txt" | grep -q "$INDEXNOW_KEY"

      - name: Submit sitemap URLs to IndexNow
        run: |
          python3 - <<'EOF'
          import json, os, re, urllib.request

          host = os.environ["HOST"]
          key = os.environ["INDEXNOW_KEY"]
          urls = re.findall(r"<loc>\s*([^<\s]+)\s*</loc>", open("sitemap.xml").read())
          urls = [u for u in urls if u == f"https://{host}" or u.startswith(f"https://{host}/")]
          if not urls:
              raise SystemExit("No URLs found in sitemap")

          body = json.dumps({
              "host": host,
              "key": key,
              "keyLocation": f"https://{host}/{key}.txt",
              "urlList": urls,
          }).encode()
          req = urllib.request.Request(
              "https://api.indexnow.org/indexnow",
              data=body,
              headers={"Content-Type": "application/json; charset=utf-8"},
          )
          with urllib.request.urlopen(req, timeout=30) as resp:
              print(f"IndexNow responded {resp.status} for {len(urls)} URLs")
          EOF
